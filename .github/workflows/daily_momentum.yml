name: NC Wealth Daily Momentum

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-momentum
  cancel-in-progress: false

jobs:
  update-watchlists:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and calculate
        run: python -u run_momentum_pipeline.py
      - name: Publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u upload_to_supabase.py
